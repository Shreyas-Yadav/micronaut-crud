services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "mn_playground"
      MYSQL_ROOT_PASSWORD: "password"
    ports: 
      - "3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  myapp:
    build: .
    environment:
      DATASOURCES_DEFAULT_URL: "jdbc:mysql://mysql:3306/mn_playground"

    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy            
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATASOURCES_DEFAULT_URL: "jdbc:mysql://mysql:3306/mn_playground"
    depends_on:
      mysql:
        condition: service_healthy
